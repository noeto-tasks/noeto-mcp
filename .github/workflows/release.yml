name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plain semver without a leading v, e.g. 0.6.3
        required: true

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Refuse a version that was already released
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists"; exit 1
          fi

      - run: make test lint

      - run: make release-pin RELEASE="$VERSION"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: plugin v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before the push below: the commit pins this image, and the plugin must
      # never point at a tag GHCR does not have.
      - run: make docker-push VERSION="v$VERSION"

      - run: git push origin main --follow-tags

      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  registry:
    needs: release
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      ref: v${{ inputs.version }}
    permissions:
      contents: read
      id-token: write
