# The Release workflow calls this as its last job. Run it by hand only to
# republish, or after a release cut with `make release-plugin`.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The release tag whose server.json to publish
        type: string
        required: true

permissions:
  contents: read
  # Interactive `mcp-publisher login github` is granted only the personal
  # namespace, never io.github.noeto-tasks; OIDC from this repo is.
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
