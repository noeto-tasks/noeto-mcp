# Manual on purpose: run it after `make release-plugin` has pushed the image
# that server.json pins.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  # Interactive `mcp-publisher login github` is granted only the personal
  # namespace, never io.github.noeto-tasks; OIDC from this repo is.
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
